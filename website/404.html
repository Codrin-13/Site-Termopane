<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagină negăsită | Termopane Accesorii Paneluri</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400..700;1,400..700&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400..700;1,400..700&display=swap" media="print" onload="this.media='all'">
    <noscript>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400..700;1,400..700&display=swap">
    </noscript>
    <link rel="stylesheet" href="style.css">
    <style>
        .page-404 {
            min-height: 100svh;
            background: #0D0D0D;
            display: flex; align-items: center; justify-content: center;
            text-align: center; flex-direction: column; gap: 1.5rem;
            padding: 2rem;
        }
        .error-code {
            font-family: 'Inter', sans-serif;
            font-size: clamp(6rem, 20vw, 12rem);
            font-weight: 700;
            color: #2563EB;
            line-height: 1;
            letter-spacing: -0.04em;
            opacity: 0.2;
        }
        .error-icon {
            width: 80px; height: 80px;
            background: rgba(37,99,235,0.1);
            border: 2px solid rgba(37,99,235,0.3);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto;
            animation: pulse404 2s ease-in-out infinite;
        }
        @keyframes pulse404 {
            0%, 100% { box-shadow: 0 0 0 0 rgba(37,99,235,0.3); }
            50% { box-shadow: 0 0 0 16px rgba(37,99,235,0); }
        }
        .error-title {
            font-family: 'Inter', sans-serif;
            font-size: clamp(1.5rem, 4vw, 2.5rem);
            font-weight: 700; color: #fff;
            letter-spacing: -0.02em;
        }
        .error-sub {
            font-family: 'Inter', sans-serif;
            color: #6B6B6B; font-size: 1rem; max-width: 420px;
        }
        .error-actions { display: flex; gap: 1rem; flex-wrap: wrap; justify-content: center; margin-top: 1rem; }
        .btn-404 {
            padding: 0.85rem 2rem; border-radius: 999px;
            font-family: 'Inter', sans-serif; font-weight: 600; font-size: 0.9rem;
            text-decoration: none; transition: 0.3s;
        }
        .btn-404--primary { background: #2563EB; color: #fff; }
        .btn-404--primary:hover { background: #1d4ed8; transform: translateY(-1px); }
        .btn-404--outline { background: transparent; border: 1.5px solid #333; color: #888; }
        .btn-404--outline:hover { border-color: #555; color: #fff; }
    </style>
</head>
<body>
    <div class="page-404">
        <div class="error-code">404</div>
        <div class="error-icon">
            <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#2563EB" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                <polyline points="9 22 9 12 15 12 15 22"/>
            </svg>
        </div>
        <h1 class="error-title">Pagina nu a fost găsită</h1>
        <p class="error-sub">Se pare că ușa pe care ai deschis-o nu duce nicăieri. Revino pe pagina principală.</p>
        <div class="error-actions">
            <a href="index.html" class="btn-404 btn-404--primary">← Înapoi acasă</a>
            <a href="catalog-pvc.html" class="btn-404 btn-404--outline">Catalog PVC</a>
            <a href="catalog-aluminiu.html" class="btn-404 btn-404--outline">Catalog Aluminiu</a>
        </div>
    </div>
</body>
</html>
